# Example utterances per mode, used for local semantic (TF-IDF cosine) routing.
# Add more examples over time from real usage - the more varied, the better
# the routing gets. No keywords/regex here on purpose: matching is by
# vector similarity over the whole sentence, not substring/keyword hits.

