# Approximate USD price per 1M tokens, used ONLY as a fallback when an
# agent's response doesn't report cost directly (Claude reports total cost
# itself; Codex today does not, so its cost here is always estimated from
# these rates). Treat all codex-derived costs as approximate.
#
# Update these if pricing changes - nothing in the code depends on the
# specific numbers, only on the model key existing (falls back to
# "unknown" rates, which report cost as null, if a model isn't listed).

models:
  opus:
    inputPer1M: 15
    outputPer1M: 75
  sonnet:
    inputPer1M: 3
    outputPer1M: 15
  haiku:
    inputPer1M: 0.8
    outputPer1M: 4
  gpt-5.1-codex:
    inputPer1M: 5
    outputPer1M: 15
  unknown:
    inputPer1M: 0
    outputPer1M: 0
